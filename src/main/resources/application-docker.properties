# Docker 环境配置
# 数据库 / Redis 主机名使用 Docker Compose service name
server.port=${SERVER_PORT:8081}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/project_cooperation_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:111111}

# Redis 连接
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:f31ae273df314d}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Lettuce 连接池
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=2000ms

# Docker 容器内上传目录
file.upload-folder=${FILE_UPLOAD_FOLDER:/app/uploads}
file.public-base-url=${FILE_PUBLIC_BASE_URL:http://localhost:8081}
