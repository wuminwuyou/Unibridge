spring.application.name=demo
server.port=8081

# 激活的配置文件（默认开发环境）
spring.profiles.active=dev

# MyBatis Plus 配置
mybatis-plus.configuration.map-underscore-to-camel-case=true
# SQL 日志已由 logback-spring.xml 统一接管，此处不指定 log-impl 以回退为 Slf4jImpl
mybatis-plus.global-config.db-config.id-type=auto

# 所有日志级别由 logback-spring.xml 统一管理，此处不再硬编码

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.packages-to-scan=com.unibridge.backend

# ============================================================
# 验证码发放限流（Redis 三层计数器）
# 原理：Lua INCR + EXPIRE 原子滑动窗口，防止爆破刷码
# 可被 application-{profile}.properties 覆盖
# ============================================================
# 账户级：同一手机/邮箱 10 分钟内最多 5 次
auth.ratelimit.account.max=5
auth.ratelimit.account.window-sec=600
# IP 级：同一 IP 10 分钟内最多 10 次
auth.ratelimit.ip.max=10
auth.ratelimit.ip.window-sec=600
# 全局级：全服务 1 分钟内最多 100 次（生产环境按短信额度调整）
auth.ratelimit.global.max=100
auth.ratelimit.global.window-sec=60

# ============================================================
# 等级评估模型 (Level Evaluation AI)
# ============================================================
# API Key 通过环境变量 DEEPSEEK_API_KEY 注入，不硬编码
level-eval.api-key=${DEEPSEEK_API_KEY:}
# DeepSeek v4 Flash 端点（支持 OpenAI 兼容接口）
level-eval.api.url=https://api.deepseek.com/v1/chat/completions
# 模型名称
level-eval.api.model=deepseek-v4-flash
